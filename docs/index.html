<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signet</title>
<meta name="description" content="Sign, customise and install iOS apps right on your iPhone, with your own certificate.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg: #faf6f0; --card: #ffffff; --text: #1d1b19; --muted: #6b645c; --line: #e8e1d7;
    --accent: #c8382a; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12100e; --card: #1d1a17; --text: #f2ede6; --muted: #a39b91; --line: #2e2a25;
      --accent: #e2523d; --accent-text: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 56px 16px 40px; text-align: center; }
  .icon { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  h1 { font-size: 40px; letter-spacing: -0.02em; margin: 20px 0 6px; }
  .tagline { color: var(--muted); margin: 0 0 32px; }
  .buttons { display: grid; gap: 10px; }
  a.button, button {
    display: block; width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  a.button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .source {
    margin: 28px 0 0; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card);
    text-align: left;
  }
  .source p { margin: 0 0 8px; color: var(--muted); font-size: 15px; }
  .source code { display: block; font: 14px ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; margin-bottom: 12px; }
  .note { color: var(--muted); font-size: 14px; margin-top: 28px; }
  .note a { color: inherit; }
</style>
</head>
<body>
<main>
  <img class="icon" src="icon.png" alt="Signet icon">
  <h1>Signet</h1>
  <p class="tagline">Sign, customise and install iOS apps right on your iPhone, with your own certificate.</p>

  <div class="buttons">
    <a class="button primary" href="altstore://source?url=https://and101.github.io/Signet/source.json">Add to AltStore</a>
    <a class="button" href="sidestore://source?url=https://and101.github.io/Signet/source.json">Add to SideStore</a>
    <a class="button" href="https://github.com/and101/Signet/releases/latest/download/Signet.ipa">Download IPA</a>
  </div>

  <div class="source">
    <p>Using Feather, Ksign or ESign? Add this source:</p>
    <code id="source">https://and101.github.io/Signet/source.json</code>
    <button type="button" id="copy">Copy Source Link</button>
  </div>

  <p class="note">Requires iOS 17 or later. Free and open source on <a href="https://github.com/and101/Signet">GitHub</a>.</p>
</main>
<script>
  document.getElementById("copy").addEventListener("click", async (event) => {
    const button = event.currentTarget;
    try {
      await navigator.clipboard.writeText(document.getElementById("source").textContent);
      button.textContent = "Copied";
    } catch {
      button.textContent = "Copy failed. Select the link above.";
    }
    setTimeout(() => { button.textContent = "Copy Source Link"; }, 2000);
  });
</script>
</body>
</html>
